<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery ops</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --border: rgba(11, 11, 11, 0.10);
    --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --border: rgba(255, 255, 255, 0.10);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --border: rgba(255, 255, 255, 0.10);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 20px 48px; }

  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 18px; font-weight: 600; margin: 0; }
  h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 28px 0 8px; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .filters input[type="date"] {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px;
  }
  .filters .sep { color: var(--muted); }
  .chip {
    font: inherit; color: var(--ink-2); background: transparent;
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; cursor: pointer;
  }
  .chip:hover { background: var(--surface); }
  .chip[aria-pressed="true"] { color: var(--ink); background: var(--surface); border-color: var(--grid); font-weight: 600; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
  .tile .label { color: var(--ink-2); font-size: 12.5px; }
  .tile .value { font-size: 28px; font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
  .tile .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 14px; white-space: nowrap; }
  th { color: var(--muted); font-size: 12px; font-weight: 500; border-bottom: 1px solid var(--grid); }
  td { border-top: 1px solid var(--grid); }
  tr:first-child td { border-top: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }

  .status { display: inline-flex; align-items: center; gap: 6px; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

  .note { color: var(--muted); font-size: 12px; margin: 8px 2px; }
  .error { color: var(--critical); margin: 12px 0; }
  .hidden { display: none; }

  #orders tr[data-id] { cursor: pointer; }
  #orders tr[data-id]:hover td { background: var(--page); }
  #orders tr[data-id]:focus-visible { outline: 2px solid var(--muted); outline-offset: -2px; }

  dialog {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--border); border-radius: 12px; padding: 0;
    width: min(680px, 92vw);
  }
  dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
  .dlg-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--grid); }
  .dlg-title { font-weight: 600; }
  .dlg-close { font: inherit; color: var(--ink-2); background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 3px 10px; cursor: pointer; }
  .dlg-close:hover { background: var(--page); }
  .dlg-body { padding: 14px 18px 18px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 13.5px; margin: 0; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; overflow-wrap: anywhere; }
  .dlg-body h2 { margin-top: 18px; }

  .items-wrap { overflow-x: auto; }
  .items th, .items td { padding: 8px 10px; }
  .items th:first-child, .items td:first-child { padding-left: 0; }
  .items th:last-child, .items td:last-child { padding-right: 0; }
  /* th/td default to nowrap for the dense tables above; item names and customer
     notes are long free text and have to wrap inside a 680px dialog. */
  .items td { white-space: normal; vertical-align: top; }
  .items .mods { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .items .mod-group { color: var(--ink-2); }
  .items .disc { color: var(--serious); }
  /* A modifier price we could not parse, and lines from a payload that failed its
     completeness checks: both are "this number is not trustworthy", never decoration. */
  .items .unparsed { color: var(--serious); border-bottom: 1px dotted currentColor; }
  .note.suspect { color: var(--serious); }
  .items tfoot td { border-top: 1px solid var(--grid); font-weight: 600; }
  pre.raw {
    background: var(--page); border: 1px solid var(--grid); border-radius: 8px;
    padding: 10px 12px; overflow: auto; max-height: 320px; font-size: 12px; margin: 14px 0 0;
  }
  /* Raw payloads are reference material, not reading material. The order detail blob
     averages ~8 KB and every line carries its own object, so they stay collapsed —
     open, they'd bury the summary above them. All render through the same pre.raw. */
  details.raw-box { margin: 14px 0 0; }
  details.raw-box > summary {
    cursor: pointer; color: var(--ink-2); font-size: 12.5px; padding: 3px 0;
    list-style-position: inside;
  }
  details.raw-box > summary:hover { color: var(--ink); }
  details.raw-box > summary:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; border-radius: 4px; }
  details.raw-box > pre.raw { margin-top: 6px; }
  /* Inside a line-item cell the block is one of many, so it sits quieter and shorter. */
  .items details.raw-box { margin: 4px 0 0; }
  .items details.raw-box > summary { color: var(--muted); font-size: 12px; }
  /* And it has to wrap. A <pre> in a table cell sets that column's MIN-content width
     to its longest line (~80 characters of itemKey), which is wider than the dialog:
     opening one block doubled the table and scrolled Qty / Unit / Amount — and the
     Items subtotal — out of view behind .items-wrap's horizontal scroll. It is
     `anywhere` and not `break-word` because only `anywhere` shrinks min-content,
     which is the measurement the table is sized from. */
  .items details.raw-box > pre.raw { max-height: 220px; white-space: pre-wrap; overflow-wrap: anywhere; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Delivery ops</h1>
    <div class="filters">
      <input type="date" id="from" aria-label="From date">
      <span class="sep">–</span>
      <input type="date" id="to" aria-label="To date">
      <button class="chip" data-days="1">Today</button>
      <button class="chip" data-days="7">7 days</button>
      <button class="chip" data-days="30">30 days</button>
    </div>
  </header>

  <div id="error" class="error hidden"></div>

  <section class="tiles">
    <div class="tile"><div class="label">Net revenue</div><div class="value" id="t-revenue">–</div><div class="sub">completed orders only</div></div>
    <div class="tile"><div class="label">Orders</div><div class="value" id="t-orders">–</div></div>
    <div class="tile"><div class="label">Completed</div><div class="value" id="t-completed">–</div></div>
    <div class="tile"><div class="label">Cancelled</div><div class="value" id="t-cancelled">–</div></div>
  </section>

  <h2>By platform</h2>
  <div class="card">
    <table>
      <thead><tr><th>Platform</th><th class="num">Orders</th><th class="num">Completed</th><th class="num">Cancelled</th><th class="num">Revenue</th></tr></thead>
      <tbody id="platforms"></tbody>
    </table>
  </div>

  <h2>Orders</h2>
  <div class="card">
    <table>
      <thead><tr><th>Date</th><th>Platform</th><th>Order</th><th>Status</th><th class="num">Net</th></tr></thead>
      <tbody id="orders"></tbody>
    </table>
  </div>
  <div id="cap-note" class="note hidden">Showing the first 100 orders in range.</div>
</div>

<dialog id="order-dialog">
  <div class="dlg-head">
    <span class="dlg-title" id="dlg-title"></span>
    <button class="dlg-close" id="dlg-close">Close</button>
  </div>
  <div class="dlg-body" id="dlg-body"></div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Status colors pair with a text label — color never carries meaning alone
const STATUS = {
  completed:   { color: 'var(--good)',     label: 'Completed' },
  in_progress: { color: 'var(--warn)',     label: 'In progress' },
  refunded:    { color: 'var(--serious)',  label: 'Refunded' },
  cancelled:   { color: 'var(--critical)', label: 'Cancelled' },
  other:       { color: 'var(--muted)',    label: 'Other' },
};
const statusHtml = s => {
  const st = STATUS[s] ?? STATUS.other;
  return `<span class="status"><span class="dot" style="background:${st.color}"></span>${st.label}</span>`;
};

// Amounts are stored in ISO 4217 minor units; Intl knows each currency's fraction digits
const fracDigits = c => {
  try { return new Intl.NumberFormat('en', { style: 'currency', currency: c }).resolvedOptions().maximumFractionDigits; }
  catch { return 2; }
};
const money = (minor, currency, compact = false) =>
  new Intl.NumberFormat(undefined, { style: 'currency', currency, ...(compact ? { notation: 'compact' } : {}) })
    .format(minor / 10 ** fracDigits(currency));

const localDate = d => new Intl.DateTimeFormat('en-CA').format(d); // YYYY-MM-DD, browser tz

function setRange(days) {
  const now = new Date();
  $('#to').value = localDate(now);
  $('#from').value = localDate(new Date(now.getTime() - (days - 1) * 86400000));
}

function markChip(days) {
  document.querySelectorAll('.chip').forEach(c =>
    c.setAttribute('aria-pressed', String(c.dataset.days === String(days))));
}

// res.json() rounds an integer past 2^53 exactly as the server's JSON.parse used to.
// Grab's orderFlags is an int64 bitfield that now reaches this page with every digit
// intact, and parsing it normally would put the wrong number back on screen in the
// one view whose whole job is showing the payload as it is. Same rescue as
// core/json.ts, feature-detected: without JSON.rawJSON this is plain JSON.parse.
const parseJson = typeof JSON.rawJSON === 'function'
  ? text => JSON.parse(text, (key, value, ctx) =>
      typeof value === 'number' && Number.isInteger(value) && !Number.isSafeInteger(value)
      && typeof ctx?.source === 'string' && ctx.source !== String(value)
        ? JSON.rawJSON(ctx.source)
        : value)
  : text => JSON.parse(text);

async function getJson(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`${url} → HTTP ${res.status}`);
  return parseJson(await res.text());
}

async function load() {
  const from = $('#from').value, to = $('#to').value;
  if (!from || !to) return;
  $('#error').classList.add('hidden');
  try {
    const q = `from=${from}&to=${to}`;
    const [summary, ordersRes] = await Promise.all([
      getJson(`/summary?${q}`),
      getJson(`/orders?${q}&limit=100`),
    ]);

    // totals is keyed by currency — revenue is never summed across currencies.
    const totals = Object.entries(summary.totals);
    $('#t-revenue').textContent = totals.length
      ? totals.map(([c, t]) => money(t.revenueMinor, c, true)).join(' + ')
      : '–';
    $('#t-orders').textContent = totals.reduce((s, [, t]) => s + t.orderCount, 0);
    $('#t-completed').textContent = totals.reduce((s, [, t]) => s + t.completedCount, 0);
    $('#t-cancelled').textContent = totals.reduce((s, [, t]) => s + t.cancelledCount, 0);

    $('#platforms').innerHTML = summary.platforms.map(p => `
      <tr>
        <td>${esc(p.platform)}</td>
        <td class="num">${p.orders}</td>
        <td class="num">${p.completed}</td>
        <td class="num">${p.cancelled}</td>
        <td class="num">${money(p.revenueMinor, p.currency)}</td>
      </tr>`).join('')
      || '<tr><td colspan="5" class="note">No data in range.</td></tr>';

    const orders = ordersRes.orders;
    $('#orders').innerHTML = orders.map(o => `
      <tr data-id="${o.id}" tabindex="0">
        <td>${esc(o.reportDate)}</td>
        <td>${esc(o.platform)}</td>
        <td>${esc(o.platformOrderId)}</td>
        <td>${statusHtml(o.status)}</td>
        <td class="num">${money(o.netAmountMinor, o.currency)}</td>
      </tr>`).join('')
      || '<tr><td colspan="5" class="note">No orders in range.</td></tr>';
    $('#cap-note').classList.toggle('hidden', orders.length < 100);
  } catch (err) {
    const el = $('#error');
    el.textContent = `Failed to load: ${err.message}`;
    el.classList.remove('hidden');
  }
}

const localDateTime = (iso, tz) =>
  new Intl.DateTimeFormat(undefined, { timeZone: tz, dateStyle: 'medium', timeStyle: 'short' }).format(new Date(iso));

// Modifiers arrive flat but ordered by position, so a group is a run of adjacent
// rows — no sorting, no lookup table, and modifiers the platform left ungrouped
// (groupId null) keep their payload order instead of collapsing into one bucket.
function modifierGroups(modifiers) {
  const groups = [];
  for (const m of modifiers) {
    const key = m.groupId ?? m.groupName;
    const last = groups[groups.length - 1];
    if (last && last.key === key && key !== null) last.modifiers.push(m);
    else groups.push({ key, name: m.groupName, modifiers: [m] });
  }
  return groups;
}

// A price of 0 renders as no price. Free options are the majority (10 of 15 in the
// sampled orders), so printing '₫0' ten times per dialog costs more than it tells
// anyone. An UNPARSED price (price_minor NULL) is a different thing entirely — a
// parser bug on a real amount — and rendering it the same as free is how it stays
// invisible, since this dialog is the only place anyone ever looks at a modifier.
// So it shows the platform's raw string, marked.
const modifierLabel = (m, currency) =>
  esc(m.name)
  + (m.quantity > 1 ? ` ×${esc(m.quantity)}` : '')
  + (m.priceMinor ? ` (${money(m.priceMinor, currency)})`
    : m.priceMinor == null && m.priceDisplay && m.priceDisplay !== '-'
      ? ` (<span class="unparsed" title="Price could not be parsed — stored as the platform's raw string">${esc(m.priceDisplay)}</span>)`
      : '');

// One renderer for every raw payload in the dialog — the statement, the order detail
// blob and each line's own object. Two implementations is how two blocks drift apart.
const rawPre = value => `<pre class="raw">${esc(JSON.stringify(value, null, 2))}</pre>`;
// Callers must not pass a missing payload: JSON.stringify(undefined) is undefined and
// would print the word. Absence gets a sentence explaining it, not an empty block.
const rawBox = (label, value) => `<details class="raw-box"><summary>${esc(label)}</summary>${rawPre(value)}</details>`;

function itemsHtml(items, currency, suspect) {
  // null and [] mean different things: never fetched vs. fetched and genuinely empty.
  if (items == null) return '<p class="note">Line items have not been fetched for this order.</p>';
  if (items.length === 0) return '<p class="note">No line items reported.</p>';

  const rows = items.map(it => `
        <tr>
          <td>
            <div>${esc(it.name)}</div>
            ${modifierGroups(it.modifiers).map(g => `
            <div class="mods">${g.name ? `<span class="mod-group">${esc(g.name)}:</span> ` : '+ '}${
              g.modifiers.map(m => modifierLabel(m, currency)).join(', ')}</div>`).join('')}
            ${it.comment ? `<div class="mods">“${esc(it.comment)}”</div>` : ''}
            ${it.discounts.map(d => `
            <div class="mods disc">− ${esc(d.name)}${
              d.amountMinor == null ? '' : ' ' + money(d.amountMinor, currency)}</div>`).join('')}
            ${it.rawJson == null ? '' : rawBox('Raw JSON', it.rawJson)}
          </td>
          <td class="num">${esc(it.quantity)}</td>
          <td class="num">${money(it.unitPriceMinor, currency)}</td>
          <td class="num">${money(it.lineTotalMinor, currency)}</td>
        </tr>`).join('');

  // "Items subtotal", never "Revenue": this is the customer-facing gross before item
  // discounts, while the Net above it is merchant earnings. Same dialog, two very
  // different numbers — mislabelling one is how the wrong figure gets quoted.
  //
  // And when the payload that produced these lines failed its own completeness
  // checks, the subtotal is exactly the number that comes out short (a 200 carrying
  // 3 of 5 lines reads ~40% low). It is also the number an operator reconciles
  // against, so it has to say so rather than look verified.
  const warning = suspect
    ? `<p class="note suspect">⚠ These lines came from a payload that failed the platform’s own
       completeness checks (${esc(suspect)}). The subtotal below is probably incomplete.</p>`
    : '';

  // Lines written before per-item raw capture have rawJson null, so their block is
  // simply absent. Said once under the table rather than on every line: on an order
  // that predates capture it is the same sentence repeated for each item.
  const noRaw = items.filter(it => it.rawJson == null).length;
  const rawNote = noRaw === 0 ? '' : `
    <p class="note">${noRaw === items.length ? 'These lines were' : `${noRaw} of ${items.length} lines were`}
      stored before per-item raw JSON was captured. Re-fetching the order fills it in.</p>`;

  return warning + `
    <div class="items-wrap"><table class="items">
      <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Amount</th></tr></thead>
      <tbody>${rows}
      </tbody>
      <tfoot><tr>
        <td>Items subtotal</td><td></td><td></td>
        <td class="num">${money(items.reduce((sum, it) => sum + it.lineTotalMinor, 0), currency)}</td>
      </tr></tfoot>
    </table></div>` + rawNote;
}

/**
 * The banner for an order whose latest fetch was REFUSED (rejected_detail_raw_json).
 *
 * What the stored lines are worth is a second question, and items_suspect is the only
 * thing that answers it. Both states are reachable and they read very differently:
 * the refusal gate protects lines it already has, but an order whose FIRST payload
 * was suspect has those lines stored anyway (partial data beats none — schema.ts),
 * flagged, and is then frozen with them. Calling them "verified" there would print a
 * reassurance three lines under the warning saying those same lines failed the
 * platform's own checks, which is how an operator reconciles against a short total
 * believing it was cross-checked.
 */
function refusedHtml(o) {
  if (o.rejectedDetailRawJson == null) return '';
  const stored = o.itemsSuspect
    ? `Those lines are no baseline either: they came from a payload that failed the same
       checks (see the warning above the table) and were stored only because there was
       nothing to lose. Both fetches of this order are doubtful.`
    : `Those lines are the earlier ones, and they passed those checks.`;
  return `
      <p class="note suspect">⚠ A later fetch of this order was refused: its payload failed the
         platform’s own completeness checks, so it was not allowed to replace the lines above —
         and this repeats every night until someone looks. ${stored}
         The refused payload is kept here because the platform will not serve it again.</p>
      ${rawBox('Refused order detail payload', o.rejectedDetailRawJson)}`;
}

async function openOrder(id) {
  try {
    const o = await getJson(`/orders/${id}`);
    const kv = (k, v) => `<dt>${k}</dt><dd>${v}</dd>`;
    $('#dlg-title').textContent = o.platformOrderId;
    $('#dlg-body').innerHTML = `
      <dl class="kv">
        ${kv('Status', statusHtml(o.status))}
        ${kv('Platform', esc(o.platform))}
        ${kv('Platform status', esc(o.platformStatus))}
        ${kv('Ordered', esc(localDateTime(o.orderedAt, o.platformTimezone)) + ' <span style="color:var(--muted)">' + esc(o.platformTimezone) + '</span>')}
        ${kv('Last update', esc(localDateTime(o.updatedAt, o.platformTimezone)))}
        ${kv('Net', money(o.netAmountMinor, o.currency))}
        ${kv('Gross', o.grossAmountMinor == null ? '–' : money(o.grossAmountMinor, o.currency))}
        ${kv('Account', esc(o.accountId))}
        ${kv('Merchant', esc(o.merchantId))}
      </dl>
      <h2>Items</h2>
      ${itemsHtml(o.items, o.currency, o.itemsSuspect)}
      ${o.itemsFetchedAt ? `<p class="note">Items last fetched ${esc(localDateTime(o.itemsFetchedAt, o.platformTimezone))}.</p>` : ''}
      <h2>Raw</h2>
      ${o.detailRawJson == null
        ? '<p class="note">The order detail payload has not been captured for this order.</p>'
        : rawBox('Order detail payload', o.detailRawJson)}
      ${refusedHtml(o)}
      ${rawPre(o.rawJson)}`;
    $('#order-dialog').showModal();
  } catch (err) {
    const el = $('#error');
    el.textContent = `Failed to load order: ${err.message}`;
    el.classList.remove('hidden');
  }
}

$('#orders').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-id]');
  if (tr) openOrder(tr.dataset.id);
});
$('#orders').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const tr = e.target.closest('tr[data-id]');
    if (tr) openOrder(tr.dataset.id);
  }
});
$('#dlg-close').addEventListener('click', () => $('#order-dialog').close());
$('#order-dialog').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.close(); // backdrop click; Esc is native
});

document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  setRange(Number(c.dataset.days));
  markChip(c.dataset.days);
  load();
}));
for (const id of ['#from', '#to']) $(id).addEventListener('change', () => { markChip(null); load(); });

setRange(7);
markChip(7);
load();
</script>
</body>
</html>
